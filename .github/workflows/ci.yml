name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gcc-debug:
    name: GCC Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: sudo ./support/install_build_deps.sh

      - name: Build debug
        run: ./scripts/build/debug.sh

      - name: Run debug tests
        run: ./scripts/test/debug.sh

  gcc-asan:
    name: GCC ASAN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: sudo ./support/install_build_deps.sh

      - name: Build ASAN
        run: ./scripts/build/asan.sh

      - name: Run ASAN tests
        run: ./scripts/test/asan.sh

  gcc-release:
    name: GCC Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: sudo ./support/install_build_deps.sh

      - name: Build release
        run: ./scripts/build/release.sh

      - name: Run release tests
        run: ctest --preset release

  clang-debug:
    name: Clang Debug
    runs-on: ubuntu-latest
    env:
      CC: clang-19
      CXX: clang++-19

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: sudo ./support/install_build_deps.sh

      - name: Build debug
        run: ./scripts/build/debug.sh

      - name: Run debug tests
        run: ./scripts/test/debug.sh

  clang-tsan:
    name: Clang TSAN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: sudo ./support/install_build_deps.sh

      - name: Build TSAN
        run: ./scripts/build/tsan.sh

      - name: Run TSAN tests
        run: ./scripts/test/tsan.sh
